<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <main>
        <h1>Codex Browser Test</h1>
        <form id="codex-form">
            <label for="prompt">Prompt</label>
            <textarea id="prompt" name="prompt" rows="6">Write a JavaScript function sum(a, b) that returns the sum of two numbers.</textarea>
            <section aria-labelledby="code-to-edit-title">
                <h2 id="code-to-edit-title">Code to edit</h2>
                <p id="code-status" role="status">Loading code...</p>
                <div id="code-files"></div>
            </section>
            <button type="submit">Run Codex</button>
        </form>
        <pre id="output" aria-live="polite"></pre>
    </main>

    <script type="module">
        import { fetchCodeFiles, submitAndRefresh } from "./client.mjs";

        const form = document.querySelector("#codex-form");
        const promptInput = document.querySelector("#prompt");
        const output = document.querySelector("#output");
        const codeStatus = document.querySelector("#code-status");
        const codeFiles = document.querySelector("#code-files");

        function renderCode(files) {
            codeFiles.replaceChildren();

            if (files.length === 0) {
                codeStatus.textContent = "No files in code-to-edit yet.";
                return;
            }

            codeStatus.textContent = `${files.length} file${files.length === 1 ? "" : "s"}`;

            for (const file of files) {
                const article = document.createElement("article");
                const title = document.createElement("h3");
                const contents = document.createElement("pre");

                title.textContent = file.path;
                contents.textContent = file.content;
                article.append(title, contents);
                codeFiles.append(article);
            }
        }

        async function loadCode() {
            codeStatus.textContent = "Loading code...";

            try {
                renderCode(await fetchCodeFiles());
            } catch (error) {
                codeStatus.textContent = error instanceof Error
                    ? `Unable to load code: ${error.message}`
                    : "Unable to load code";
            }
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            output.textContent = "Running...";

            try {
                await submitAndRefresh(promptInput.value, {
                    onFinalResponse(finalResponse) {
                        output.textContent = finalResponse;
                    },
                    onCodeFiles: renderCode,
                });
            } catch (error) {
                if (output.textContent === "Running...") {
                    output.textContent = error instanceof Error ? error.message : "Unexpected error";
                } else {
                    codeStatus.textContent = error instanceof Error
                        ? `Unable to refresh code: ${error.message}`
                        : "Unable to refresh code";
                }
            }
        });

        await loadCode();
    </script>
</body>

</html>
