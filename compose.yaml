services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    environment:
      CLIENT_PORT: "5173"
      SERVER_PORT: "3001"
      CODEX_HOME: /home/node/.codex
      FFMPEG_PATH: /usr/bin/ffmpeg
      WHISPER_CPP_PATH: /opt/whisper/bin/whisper-cli
      WHISPER_MODEL_PATH: /opt/whisper/models/ggml-base.bin
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - chats:/app/chats
      - codex_home:/home/node/.codex

volumes:
  node_modules:
  chats:
  codex_home:
